<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">
  <defs>
    <radialGradient id="bg" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#5dff8a"/>
      <stop offset="60%" stop-color="#0a7a2a"/>
      <stop offset="100%" stop-color="#054d18"/>
    </radialGradient>
    <style>
      @keyframes shimmer1 { 0%,100%{opacity:.95;r:2} 50%{opacity:.5;r:1.5} }
      @keyframes shimmer2 { 0%,100%{opacity:.6;r:1} 50%{opacity:.95;r:1.8} }
      @keyframes shimmer3 { 0%,100%{opacity:.85;r:1.5} 50%{opacity:.45;r:1} }
      @keyframes shimmer4 { 0%,100%{opacity:.5;r:1.2} 50%{opacity:.9;r:1.8} }
      @keyframes shimmer5 { 0%,100%{opacity:.75;r:1} 50%{opacity:.35;r:.8} }
      @keyframes shimmer6 { 0%,100%{opacity:.9;r:1.5} 50%{opacity:.55;r:1} }
      @keyframes shimmer7 { 0%,100%{opacity:.65;r:1.2} 50%{opacity:.95;r:1.6} }
      @keyframes shimmer8 { 0%,100%{opacity:.55;r:1} 50%{opacity:.85;r:1.5} }
      .s1{animation:shimmer1 3.2s ease-in-out infinite}
      .s2{animation:shimmer2 4.1s ease-in-out infinite}
      .s3{animation:shimmer3 3.7s ease-in-out infinite}
      .s4{animation:shimmer4 4.5s ease-in-out infinite}
      .s5{animation:shimmer5 3.0s ease-in-out infinite}
      .s6{animation:shimmer6 5.0s ease-in-out infinite}
      .s7{animation:shimmer7 3.9s ease-in-out infinite}
      .s8{animation:shimmer8 4.3s ease-in-out infinite}
    </style>
  </defs>
  <!-- Background -->
  <rect width="48" height="48" rx="8" fill="url(#bg)"/>
  <!-- Sparkles -->
  <circle class="s1" cx="8" cy="5" r="2" fill="#fff"/>
  <circle class="s2" cx="38" cy="7" r="1.5" fill="#e0fff0"/>
  <circle class="s3" cx="43" cy="18" r="1" fill="#b0ffcc"/>
  <circle class="s4" cx="6" cy="40" r="1.5" fill="#c0ffd8"/>
  <circle class="s5" cx="40" cy="38" r="2" fill="#d0ffe4"/>
  <circle class="s6" cx="24" cy="3" r="1" fill="#fff"/>
  <circle class="s7" cx="3" cy="24" r="1" fill="#a0ffc0"/>
  <circle class="s8" cx="26" cy="44" r="1" fill="#fff"/>
  <!-- Star (pink, slightly brighter) -->
  <g filter="url(#glow)">
    <path d="M24 3 L28.5 17 L43 17 L31 25.5 L35.5 40 L24 31.5 L12.5 40 L17 25.5 L5 17 L19.5 17 Z"
          fill="#ff7ec4" stroke="#ffaad8" stroke-width="0.8"/>
    <path d="M24 8 L27 18 L36 18 L29 23.5 L32 33 L24 27.5 L16 33 L19 23.5 L12 18 L21 18 Z"
          fill="#ffb0da" opacity="0.4"/>
  </g>
  <filter id="glow">
    <feDropShadow dx="0" dy="0" stdDeviation="1.5" flood-color="#ff90cc" flood-opacity="0.5"/>
  </filter>
</svg>
